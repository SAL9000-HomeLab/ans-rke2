---
# roles/rke2_traefik/defaults/main.yml
# Settings for the Traefik ingress controller RKE2 deploys (its rke2-traefik chart), applied through a
# HelmChartConfig.

# Fixed LoadBalancer address for Traefik (ports 80 and 443), held by kube-vip. Point the DNS names of the apps it
# serves at it. Empty leaves Traefik as RKE2 sets it up (host ports 80/443 on every node, no LoadBalancer).
rke2_traefik_lb_ip: ""

# Local keeps the clients' source addresses (needed for IP allowlists); kube-vip then announces the address from a
# node running Traefik, which is every node (Traefik is a DaemonSet).
rke2_traefik_external_traffic_policy: Local

# Sources whose X-Forwarded-* headers Traefik keeps (on the web and websecure entrypoints) instead of replacing them
# with its own, so the apps see the real client address. For a proxy inside the cluster, such as cloudflared (a
# Cloudflare Tunnel), that's the pod network (RKE2's default cluster-cidr 10.42.0.0/16). Every pod in that range can
# then set the client address the apps see; IP allowlists aren't affected (they check the connection's own source).
# Empty: Traefik trusts no one's headers.
rke2_traefik_trusted_ips: []

# More chart values merged into the HelmChartConfig (https://github.com/traefik/traefik-helm-chart).
rke2_traefik_values: {}

# How long to wait for the LoadBalancer address (retries x 10 seconds).
rke2_traefik_wait_retries: 30
