---
# roles/ceph_csi/tasks/main.yml
# Install ceph-csi's RBD and/or CephFS driver through RKE2's Helm controller, each in its own namespace (the two charts
# use the same ConfigMap names), with its Ceph key in a Secret and its StorageClass. Runs on a server.

- name: Check the Ceph settings
  ansible.builtin.assert:
    that:
      - ceph_csi_cluster_id is match('^[0-9a-f-]{36}$')
      - ceph_csi_monitors | length > 0
      - ceph_csi_rbd_pool | length == 0 or ceph_csi_rbd_key | length > 0
      - ceph_csi_cephfs_fs_name | length == 0 or ceph_csi_cephfs_key | length > 0
      - ceph_csi_rbd_pool | length > 0 or ceph_csi_cephfs_fs_name | length > 0
      - ceph_csi_rbd_mounter in ['rbd-nbd', 'krbd']
      - ceph_csi_cephfs_mounter in ['fuse', 'kernel']
    fail_msg: >-
      ceph-csi needs ceph_csi_cluster_id (the Ceph fsid), ceph_csi_monitors, and at least one of ceph_csi_rbd_pool
      (with ceph_csi_rbd_key) and ceph_csi_cephfs_fs_name (with ceph_csi_cephfs_key). The keys come from an AWX
      credential. ceph_csi_rbd_mounter is rbd-nbd or krbd, ceph_csi_cephfs_mounter fuse or kernel.
    quiet: true

- name: Install the drivers
  ansible.builtin.include_tasks: driver.yml
  loop:
    - name: rbd
      enabled: "{{ ceph_csi_rbd_pool | length > 0 }}"
      user: "{{ ceph_csi_rbd_user }}"
      key: "{{ ceph_csi_rbd_key }}"
      storage_class: "{{ ceph_csi_rbd_storage_class }}"
      access_mode: ReadWriteOnce
    - name: cephfs
      enabled: "{{ ceph_csi_cephfs_fs_name | length > 0 }}"
      user: "{{ ceph_csi_cephfs_user }}"
      key: "{{ ceph_csi_cephfs_key }}"
      storage_class: "{{ ceph_csi_cephfs_storage_class }}"
      access_mode: ReadWriteMany
  loop_control:
    loop_var: ceph_csi_driver
    label: "{{ ceph_csi_driver.name }}"
  when: ceph_csi_driver.enabled | bool
