---
# roles/kube_vip/tasks/cloud_provider.yml
# Deploy kube-vip's cloud provider, which gives LoadBalancer services an address from kube_vip_lb_range (kube-vip on
# the servers then announces it). Runs once, on a server, after the cluster is up.

- name: Check the LoadBalancer address range
  ansible.builtin.assert:
    that:
      - kube_vip_lb_range is match('^([0-9]{1,3}[.]){3}[0-9]{1,3}(-([0-9]{1,3}[.]){3}[0-9]{1,3}|/[0-9]{1,2})$')
    fail_msg: >-
      kube_vip_lb_range must be an address range (192.0.2.202-192.0.2.220) or a CIDR (192.0.2.224/28); got
      '{{ kube_vip_lb_range }}'.
    quiet: true

- name: Deploy kube-vip's cloud provider
  ansible.builtin.include_role:
    name: kubectl_apply
  vars:
    kubectl_apply_name: kube-vip cloud provider
    kubectl_apply_manifest: "{{ lookup('ansible.builtin.template', 'kube-vip-cloud-provider.yaml.j2') }}"
