---
# Builds the RKE2 cluster described by the inventory groups rke2_servers and rke2_agents, with kube-vip holding the
# API address on the servers. Safe to re-run: each node's configuration and labels converge to the inventory, and a
# changed configuration restarts one node at a time.

- name: Find the cluster
  hosts: rke2_servers:rke2_agents
  become: true
  tasks:
    - name: Check the inventory and look for an existing cluster
      ansible.builtin.include_role:
        name: rke2_cluster
        tasks_from: discover.yml

# One server at a time: a changed manifest restarts kube-vip, and the API address must stay up.
- name: Run kube-vip on the servers
  hosts: rke2_servers
  become: true
  gather_facts: false
  serial: 1
  roles:
    - role: kube_vip

- name: Start the server the cluster starts on
  hosts: rke2_cluster_init
  become: true
  gather_facts: false
  tasks:
    - name: Configure and start RKE2
      ansible.builtin.include_role:
        name: rke2_cluster
        tasks_from: node.yml

- name: Join the other servers one at a time
  hosts: rke2_servers:!rke2_cluster_init
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Configure and start RKE2
      ansible.builtin.include_role:
        name: rke2_cluster
        tasks_from: node.yml

- name: Join the agents one at a time
  hosts: rke2_agents
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Configure and start RKE2
      ansible.builtin.include_role:
        name: rke2_cluster
        tasks_from: node.yml

- name: Label the nodes
  hosts: rke2_servers:rke2_agents
  become: true
  gather_facts: false
  tasks:
    - name: Set the zone and node labels
      ansible.builtin.include_role:
        name: rke2_cluster
        tasks_from: labels.yml

# Cluster add-ons, each switched on by its variables: kube-vip's cloud provider (kube_vip_lb_range), Traefik's
# LoadBalancer address (rke2_traefik_lb_ip), Ceph and NFS storage (ceph_csi_enabled, nfs_csi_enabled), cert-manager
# (cert_manager_enabled) and Rancher (rancher_enabled).
- name: Install the cluster add-ons
  hosts: rke2_cluster_init
  become: true
  gather_facts: false
  tasks:
    - name: Deploy kube-vip's cloud provider for LoadBalancer services
      ansible.builtin.include_role:
        name: kube_vip
        tasks_from: cloud_provider.yml
      when: kube_vip_lb_range | default('') | length > 0

    - name: Give Traefik its LoadBalancer address
      ansible.builtin.include_role:
        name: rke2_traefik
      when: rke2_traefik_lb_ip | default('') | length > 0

    - name: Install Ceph storage
      ansible.builtin.include_role:
        name: ceph_csi
      when: ceph_csi_enabled | default(false) | bool

    - name: Install NFS storage
      ansible.builtin.include_role:
        name: nfs_csi
      when: nfs_csi_enabled | default(false) | bool

    - name: Install cert-manager
      ansible.builtin.include_role:
        name: cert_manager
      when: cert_manager_enabled | default(false) | bool

    - name: Install Rancher
      ansible.builtin.include_role:
        name: rancher
      when: rancher_enabled | default(false) | bool
