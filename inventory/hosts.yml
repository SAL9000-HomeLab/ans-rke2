---
# Example inventory: placeholder names and documentation addresses only. The real inventory lives in AWX/Ascender
# (or a gitignored local/ copy). Keep the group names; the plays in site.yml key off them.
all:
  children:
    rke2_cluster:
      children:
        rke2_servers:
          hosts:
            rke2-s01.lab.example.com: {rke2_cluster_node_zone: pve01}
            rke2-s02.lab.example.com: {rke2_cluster_node_zone: pve02}
            rke2-s03.lab.example.com: {rke2_cluster_node_zone: pve03}
        rke2_agents:
          hosts:
            rke2-a01.lab.example.com: {rke2_cluster_node_zone: pve01}
            rke2-a02.lab.example.com: {rke2_cluster_node_zone: pve02}
            rke2-a03.lab.example.com: {rke2_cluster_node_zone: pve03}
      vars:
        ansible_user: ansible
        rke2_cluster_api_address: 192.0.2.10
        rke2_cluster_api_hostname: rke2-api.lab.example.com
        # Add-ons (secrets such as cert_manager_cloudflare_api_token come from AWX credentials)
        kube_vip_lb_range: 192.0.2.202-192.0.2.220
        rke2_traefik_lb_ip: 192.0.2.201
        cert_manager_enabled: true
        cert_manager_acme_email: admin@example.com
        rancher_enabled: true
        rancher_hostname: rancher.app.example.com
